<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Add to This Vault</title>
<style>
  body { font-family: -apple-system, Arial, sans-serif; max-width: 520px; margin: 60px auto; padding: 0 20px; color: #1a1a1a; }
  h1 { font-size: 22px; }
  label { display: block; margin-top: 16px; font-weight: 600; font-size: 14px; }
  input, textarea { width: 100%; padding: 8px; margin-top: 6px; font-size: 14px; box-sizing: border-box; border: 1px solid #ccc; border-radius: 6px; }
  button { margin-top: 20px; padding: 10px 18px; font-size: 14px; background: #1a1a1a; color: white; border: none; border-radius: 6px; cursor: pointer; }
  button:hover { background: #333; }
  #result { margin-top: 24px; padding: 14px; background: #f4f4f4; border-radius: 8px; font-size: 14px; display: none; }
  .hint { color: #666; font-size: 13px; margin-top: 4px; }
  #teaser-box { background: #f4f4f4; padding: 14px; border-radius: 8px; margin-bottom: 20px; font-size: 14px; color: #444; }
  #form-area.hidden, #teaser-box.hidden { display: none; }
</style>
</head>
<body>
  <h1>🎁 Add to This Vault</h1>
  <p class="hint">You can only add your own content here — this page never shows what anyone else has already added, even you if you come back. That's by design, not a bug.</p>

  <div id="teaser-box"></div>

  <div id="form-area">
    <label for="contributorName">Your name (optional, shown when the vault opens)</label>
    <input type="text" id="contributorName" placeholder="Dad">

    <label for="message">Your Message</label>
    <textarea id="message" rows="4" placeholder="Happy graduation! We're so proud of you..."></textarea>

    <label for="mediaFiles">Photos &amp; Videos (optional)</label>
    <input type="file" id="mediaFiles" accept="image/*,video/*" multiple>

    <label for="docFiles">Documents (optional)</label>
    <input type="file" id="docFiles" accept=".pdf,.doc,.docx,.txt,.rtf" multiple>
    <p class="hint">Keep each file under 25MB, combined under 100MB.</p>

    <button onclick="submitContribution()">Add My Content</button>
  </div>

  <div id="result"></div>

<script>
const params = new URLSearchParams(window.location.search);
const capsuleId = params.get('id');

if (!capsuleId) {
  document.body.innerHTML = '<p>No vault ID provided.</p>';
}

// Show the teaser/countdown context only - this call is safe because the server
// never includes any contribution content in the locked-state response.
async function loadTeaser() {
  const res = await fetch(`/api/capsules/${capsuleId}`);
  if (!res.ok) {
    document.getElementById('teaser-box').textContent = 'Vault not found.';
    document.getElementById('form-area').classList.add('hidden');
    return;
  }
  const data = await res.json();
  if (data.locked) {
    document.getElementById('teaser-box').textContent = data.lockMessage
      ? `${data.lockMessage} (unlocks in ${Math.max(0, Math.floor(data.secondsRemaining / 86400))} day(s))`
      : `This vault is still open for contributions.`;
  } else {
    document.getElementById('teaser-box').textContent = 'This vault has already unlocked - it is no longer accepting new contributions.';
    document.getElementById('form-area').classList.add('hidden');
  }
}
loadTeaser();

async function submitContribution() {
  const contributorName = document.getElementById('contributorName').value.trim();
  const message = document.getElementById('message').value.trim();
  const files = [
    ...Array.from(document.getElementById('mediaFiles').files),
    ...Array.from(document.getElementById('docFiles').files),
  ];

  if (!message && files.length === 0) {
    alert('Please add a message or at least one attachment.');
    return;
  }

  const attachments = await Promise.all(files.map((file) => {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => resolve({ dataUrl: reader.result, fileName: file.name });
      reader.onerror = reject;
      reader.readAsDataURL(file);
    });
  }));

  const res = await fetch(`/api/capsules/${capsuleId}/contribute`, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ contributorName, message, attachments })
  });
  const data = await res.json();

  const resultDiv = document.getElementById('result');
  resultDiv.style.display = 'block';

  if (data.error) {
    resultDiv.innerHTML = `<strong>Error:</strong> ${data.error}`;
    return;
  }

  // Show back only what THIS person just submitted - never fetched from the
  // server, just the data already sitting in this browser's own form.
  document.getElementById('form-area').classList.add('hidden');
  resultDiv.innerHTML = `
    <strong>Added!</strong> Here's what you just submitted:<br><br>
    ${contributorName ? `<strong>From:</strong> ${contributorName}<br>` : ''}
    ${message ? `<strong>Message:</strong> ${message}<br>` : ''}
    ${files.length ? `<strong>Files:</strong> ${files.map(f => f.name).join(', ')}<br>` : ''}
    <br>This is sealed in the vault now - you won't see it (or anyone else's contribution) again until it unlocks.
  `;
}
</script>
</body>
</html>
